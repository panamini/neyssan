[imports]
# SpanCat config for CV parsing - RECALL-OPTIMIZED VERSION
# Focused on maximizing span detection recall with expanded n-gram coverage

[paths]
train = "my-app/testdata/cv_filtered/train_spans.spacy"
dev = "my-app/testdata/cv_filtered/dev_spans.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = "pytorch"
seed = 42

[nlp]
lang = "en"
pipeline = ["transformer","spancat"]
batch_size = 8
tokenizer = {"@tokenizers":"spacy.Tokenizer.v1"}
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[components]

[components.spancat]
factory = "spancat"
scorer = {"@scorers":"spacy.spancat_scorer.v1"}
spans_key = "sc"
max_positive = 128
threshold = 0.15

[components.spancat.suggester]
@misc = "spacy.ngram_suggester.v1"
sizes = [1,2,3,4,5,6,7]

[components.spancat.model]
@architectures = "spacy.SpanCategorizer.v1"
reducer = {"@layers":"reduce_mean.v1"}
tok2vec = {"@architectures":"spacy-transformers.TransformerListener.v1","grad_factor":1.0,"pooling":{"@layers":"reduce_mean.v1"},"upstream":"*"}


[components.transformer]
factory = "transformer"
max_batch_items = 32

[components.transformer.model]
@architectures = "spacy-transformers.TransformerModel.v3"
name = "roberta-base"
mixed_precision = false

[components.transformer.model.get_spans]
@span_getters = "spacy-transformers.strided_spans.v1"
window = 160
stride = 112

[components.transformer.model.tokenizer_config]
use_fast = true
model_max_length = 512

[components.transformer.model.transformer_config]
gradient_checkpointing = true
use_cache = false



[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[training]
accumulate_gradient = 8
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
patience = 0
max_epochs = 0
max_steps = 450
eval_frequency = 50
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_padded.v1"
size = 2
buffer = 128
discard_oversize = false

[training.logger]
@loggers = "spacy.ConsoleLogger.v3"
console_output = true
progress_bar = "train"

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 0.1
use_averages = false
eps = 1e-8

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
warmup_steps = 150
total_steps = 450
initial_rate = 0.000005

[training.score_weights]
spans_sc_r = 1.0
spans_sc_p = 0.0
spans_sc_f = 0.0
spans_sc_per_type = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.components.spancat]
labels = ["SKILL","END_DATE","ROLE","COMPANY","LANGUAGE","DEGREE","START_DATE","INSTITUTION","CERTIFICATE","ACHIEVEMENT"]

[initialize.tokenizer]