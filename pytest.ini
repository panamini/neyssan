[pytest]
# Prevent pytest from recursing into the legacy pdf-ingest integration/unit tests
# by default. This avoids connection errors when the DB/HTTP services for
# pdf-ingest are not available in CI or local runs.
#
# If you want to run those tests explicitly, either:
#  - set ENABLE_PDF_INGEST_TESTS=1 and run `pytest pdf-ingest` (conftest guard),
#  - or temporarily remove/rename this config.
addopts = --ignore=pdf-ingest --ignore=pdf_ingest
norecursedirs = pdf-ingest pdf_ingest