[alembic]
# Path to migration scripts
script_location = alembic

# File template for migrations
file_template = %%(rev)s_%%(slug)s

# Where revision files live
version_locations = alembic/versions

# Synchronous Postgres URL (container DB host 'db')
sqlalchemy.url = postgresql://postgres:postgres@db:5432/pdf_ingest

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
level = INFO
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt =
