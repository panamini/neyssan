services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.python311
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pdf_ingest
      - REDIS_URL=redis://redis:6379
      - PDF_INGEST_DEBUG_LOG=${PDF_INGEST_DEBUG_LOG:-/tmp/pdf_ingest_debug.log}
      - LLM_MOCK=${LLM_MOCK:-false}
    volumes:
      - .:/app
      - ./diagnostics:/tmp
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdf_ingest
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.python311
    # Use a Python entry script to start the worker programmatically to avoid rq-cli/click incompat issues.
    command: python worker_entry.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pdf_ingest
      - REDIS_URL=redis://redis:6379
      - PDF_INGEST_DEBUG_LOG=${PDF_INGEST_DEBUG_LOG:-/tmp/pdf_ingest_debug.log}
      - LLM_MOCK=${LLM_MOCK:-false}
    volumes:
      - .:/app
      - ./diagnostics:/tmp
    depends_on:
      - db
      - redis

volumes:
  db_data: {}
