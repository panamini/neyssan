name: Release (build, bench, push)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "release-*" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/cv-parser
  DOCKER_BUILDKIT: "1"

jobs:
  build-test-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load for tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --rm --name cv-parser -p 8000:8000 --shm-size=1g \
            -e CV_OCR_ENGINE=doctr \
            $IMAGE_NAME:test
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/metrics | egrep 'cv_parser_ocr_engine_total|cv_parser_route_total' || true

      - name: Bench fixtures
        run: ./scripts/bench_fixtures.sh

      - name: Review bench
        run: python scripts/review_bench.py

      - name: Compute tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            shortsha=$(git rev-parse --short=8 HEAD)
            echo "tag=sha-${shortsha}" >> $GITHUB_OUTPUT
          fi

      - name: Build & push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
