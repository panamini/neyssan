name: CV Parser Service CI

on:
  push:
    branches: ["main"]
    paths:
      - "cv_parser_service/**"
  pull_request:
    branches: ["main"]
    paths:
      - "cv_parser_service/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cv-parser-service image
        run: |
          docker build \
            -t cv-parser-service \
            -f cv_parser_service/Dockerfile \
            .

      - name: Smoke test service
        run: |
          docker run -d --rm -p 8000:8000 --name cv-parser-service cv-parser-service
          # Wait for the service to start
          for i in {1..360}; do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "Service healthy";
              break;
            fi
            sleep 2
          done
          if ! curl -fsS http://localhost:8000/healthz > /dev/null; then
            echo "::error::cv-parser-service did not become healthy within the wait window"
            docker logs cv-parser-service || true
            exit 1
          fi
          curl -fsS http://localhost:8000/healthz
        shell: bash

      - name: Stop container
        if: always()
        run: docker stop cv-parser-service || true

      # TODO: Add deployment step (e.g. Fly.io, Render) once hosting credentials are available.
