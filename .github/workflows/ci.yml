name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # Existing python pytest job (pdf-ingest)
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    env:
      LLM_MOCK: "true"
      PDF_INGEST_LLM_PROVIDER: "mock"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (pdf-ingest)
        run: |
          python -m pip install --upgrade pip
          pip install -r pdf-ingest/requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -q

  # JS tests in my-app with/without optional SDKs (openai, mistral)
  js-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: 18
            openai: false
            mistral: false
          - node-version: 18
            openai: true
            mistral: false
          - node-version: 18
            openai: false
            mistral: true
          - node-version: 18
            openai: true
            mistral: true
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            my-app/package-lock.json

      - name: Install dependencies (my-app)
        working-directory: my-app
        run: npm ci

      - name: Install optional SDKs when requested
        if: ${{ matrix.openai || matrix.mistral }}
        working-directory: my-app
        env:
          OPENAI: ${{ matrix.openai }}
          MISTRAL: ${{ matrix.mistral }}
        run: |
          if [ "$OPENAI" = "true" ]; then
            npm install openai --no-audit --no-fund
          fi
          if [ "$MISTRAL" = "true" ]; then
            npm install mistral --no-audit --no-fund
          fi

      - name: Run JS tests (vitest) in my-app
        working-directory: my-app
        run: npm test --silent

  contact-telemetry:
    runs-on: ubuntu-latest
    needs: [python-tests, js-tests]
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install minimal dependencies for contact telemetry
        run: |
          python -m pip install --upgrade pip
          pip install "spacy>=3.7,<3.8"

      - name: Gate contact rules on canonical gold set
        run: |
          python - <<'PY'
            from pathlib import Path
            from cv_parser.scripts.evaluate_contact_rules import evaluate

            gold_path = Path("my-app/testdata/cv_filtered/contacts_golden.spacy")
            metrics = evaluate([gold_path])
            threshold = 0.95
            failed = []
            for label in ("EMAIL", "PHONE", "URL", "DEGREE"):
                data = metrics[label]
                if data["precision"] < threshold or data["recall"] < threshold:
                    failed.append(f"{label}: precision={data['precision']:.3f}, recall={data['recall']:.3f}")
            if failed:
                raise SystemExit("Contact rule regression detected: " + "; ".join(failed))
            print("✅ Contact rules meet 95% precision/recall on contacts_golden.spacy")
          PY

      - name: Smoke run on synthetic contacts DocBin
        run: |
          python cv_parser/scripts/evaluate_contact_rules.py \
            --docbin my-app/testdata/cv_filtered/contacts_dev.spacy

      - name: Build error bucket diagnostics
        run: |
          python cv_parser/scripts/error_buckets.py \
            --gold my-app/testdata/cv_filtered/contacts_golden.spacy \
            --out diagnostics/error_buckets_contacts_ci.json

      - name: Sanity-check bucket categories
        run: |
          python - <<'PY'
            import json
            from pathlib import Path
            payload = json.loads(Path("diagnostics/error_buckets_contacts_ci.json").read_text())
            categories = payload.get("categories", {})
            if len(categories) < 5:
                raise SystemExit(f"Expected at least 5 bucket categories, found {len(categories)}")
            print(f"✅ Error buckets generated with {len(categories)} categories")
          PY

  precision-probe:
    # BLOCKING gate: fails PR if precision < 0.30 (script exits non-zero)
    runs-on: ubuntu-latest
    needs: [python-tests, js-tests]
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', 'cv_parser/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies for precision probe
        run: |
          python -m pip install --upgrade pip
          pip install "spacy>=3.7,<3.8" "spacy-transformers>=1.3.4"

      - name: Run precision probe
        run: |
          python scripts/run_precision_probe.py --max-steps 150 --gate 0.30 --max-retries 2

      - name: Check probe summary
        if: always()
        run: |
          if [ -f diagnostics/probe_summary.json ]; then
            cat diagnostics/probe_summary.json
          fi

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-probe-artifacts
          path: |
            diagnostics/predictions_dev_probe.json
            diagnostics/predictions_golden_probe.json
            diagnostics/error_buckets_dev_probe.json
            diagnostics/error_buckets_golden_probe.json
            diagnostics/probe_summary.json

  probe-300:
    # Non-blocking exploratory job: deeper metrics/FP analysis on main
    continue-on-error: true
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [contact-telemetry, precision-probe]
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "spacy>=3.7,<3.8" "spacy-transformers>=1.3.4"

      - name: Run 300-step probe
        run: |
          python scripts/run_probe_300.py --max-steps 300 --gate 0.30
          echo "✅ Completed probe run (non-blocking)."

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-300-artifacts
          path: |
            diagnostics/predictions_dev_probe300.json
            diagnostics/predictions_golden_probe300.json
            diagnostics/error_buckets_dev_probe300.json
            diagnostics/error_buckets_golden_probe300.json
            diagnostics/probe_300_summary.json

  multilingual-smoke:
    runs-on: ubuntu-latest
    needs: [contact-telemetry, precision-probe]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install spaCy transformers
        run: |
          python -m pip install --upgrade pip
          pip install "spacy>=3.7,<3.9" spacy-transformers>=1.3.4 pytest

      - name: Run multilingual smoke tests
        env:
          RUN_MULTILINGUAL_SMOKE: '1'
        run: |
          pytest -m slow -q
