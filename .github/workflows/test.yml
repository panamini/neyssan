name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      PADDLE_CPU_THREADS: 1
      GOLDEN_MAX: 1
      GOLDEN_DPI: 120
      RUN_GOLDEN: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            cv_parser_service/requirements.txt

      - name: Install system deps (Tesseract + poppler + libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-fra \
            libglib2.0-0 libsm6 libxrender1 libxext6 libgl1 \
            libopenblas0 liblapack3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cv_parser_service/requirements.txt

      - name: Print mode
        run: |
          echo "Running SMOKE battery: GOLDEN_MAX=${GOLDEN_MAX}, GOLDEN_DPI=${GOLDEN_DPI}, RUN_GOLDEN=${RUN_GOLDEN}"
          python -c "import platform, sys; print('Python', sys.version); print('Machine', platform.machine())"
          python -c "import paddle; print('Paddle', paddle.__version__)"
          python -c "import pytesseract; print('pytesseract OK')" || echo "pytesseract not installed (optional)"

      - name: Run pytest (smoke 1 PDF)
        run: |
          pytest -v cv_parser/tests/test_parser_battery.py

  golden-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      PADDLE_CPU_THREADS: 1
      RUN_GOLDEN: 1
      GOLDEN_MAX: 0
      GOLDEN_DPI: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            cv_parser_service/requirements.txt

      - name: Install system deps (Tesseract + poppler + libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-fra \
            libglib2.0-0 libsm6 libxrender1 libxext6 libgl1 \
            libopenblas0 liblapack3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cv_parser_service/requirements.txt

      - name: Print mode
        run: |
          echo "Running FULL golden battery: RUN_GOLDEN=${RUN_GOLDEN}, GOLDEN_MAX=${GOLDEN_MAX}, GOLDEN_DPI=${GOLDEN_DPI}"
          python -c "import platform, sys; print('Python', sys.version); print('Machine', platform.machine())"
          python -c "import paddle; print('Paddle', paddle.__version__)"
          python -c "import pytesseract; print('pytesseract OK')"

      - name: Run pytest (full golden set)
        run: |
          pytest -v cv_parser/tests/test_parser_battery.py

