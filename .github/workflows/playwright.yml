name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install app dependencies
      run: npm ci --prefix my-app
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Check Playwright app URL
      run: |
        if [ -z "${PLAYWRIGHT_APP_URL:-}" ]; then
          echo "::error::Set the repository variable PLAYWRIGHT_APP_URL to the app URL Playwright should test."
          exit 1
        fi
        curl --fail --show-error --silent --head "${PLAYWRIGHT_APP_URL}"
      env:
        PLAYWRIGHT_APP_URL: ${{ vars.PLAYWRIGHT_APP_URL }}
    - name: Run Playwright tests
      run: npx playwright test
      env:
        PLAYWRIGHT_APP_URL: ${{ vars.PLAYWRIGHT_APP_URL }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
