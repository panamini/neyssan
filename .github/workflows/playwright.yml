name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install app dependencies
      run: npm ci --prefix my-app
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Generate Convex client bindings
      run: |
        if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
          echo "::error::Set the repository secret CONVEX_DEPLOY_KEY to a deploy key for the dev Convex deployment."
          exit 1
        fi
        if [ -z "${CONVEX_DEPLOYMENT:-}" ]; then
          echo "::error::Set the repository variable CONVEX_DEPLOYMENT to the dev deployment used for Playwright CI."
          exit 1
        fi
        cd my-app
        npx convex codegen --typecheck disable
      env:
        CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
        CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    - name: Start local Vite app
      run: |
        if [ -z "${VITE_CONVEX_URL:-}" ]; then
          echo "::error::Set the repository variable VITE_CONVEX_URL to the dev Convex URL used by the frontend."
          exit 1
        fi
        if [ -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]; then
          echo "::error::Set the repository variable VITE_CLERK_PUBLISHABLE_KEY for the frontend boot."
          exit 1
        fi
        mkdir -p tmp
        npm --prefix my-app run dev:frontend:raw -- --host 127.0.0.1 --port 5173 --strictPort --clearScreen false > tmp/playwright-vite.log 2>&1 &
        for attempt in $(seq 1 90); do
          if curl --fail --show-error --silent --head http://127.0.0.1:5173 >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "::error::Vite did not become ready on http://127.0.0.1:5173"
        tail -n 200 tmp/playwright-vite.log
        exit 1
      env:
        VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        NEXT_PUBLIC_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    - name: Run Playwright tests
      run: timeout --kill-after=60s 15m npx playwright test --project=chromium --global-timeout=840000
      env:
        PLAYWRIGHT_APP_URL: http://127.0.0.1:5173
        VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        NEXT_PUBLIC_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: playwright-test-results
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
