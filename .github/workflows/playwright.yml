name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches:
      - main
      - master
      - application-os-foundation
      - codex/pr87-7b-proposal-body-composer-contract
  workflow_dispatch:
    inputs:
      suite:
        description: "Playwright suite to run"
        type: choice
        required: true
        default: full
        options:
          - smoke
          - full
  schedule:
    - cron: "17 5 * * 1-5"
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          package-lock.json
          my-app/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install app dependencies
      run: npm ci --prefix my-app
    - name: Install Playwright browser dependencies
      run: npm exec -- playwright install-deps chromium
    - name: Verify system Chrome
      run: command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser
    - name: Verify checked-in Convex client bindings
      run: |
        cd my-app
        test -s convex/_generated/api.d.ts
        test -s convex/_generated/dataModel.d.ts
        test -s convex/_generated/server.d.ts
        test -s convex/_generated/api.js
        test -s convex/_generated/server.js
        npx tsc -p convex/tsconfig.json --noEmit
    - name: Start local Vite app
      run: |
        if [ -z "${VITE_CONVEX_URL:-}" ]; then
          echo "::error::Set the repository variable VITE_CONVEX_URL to the dev Convex URL used by the frontend."
          exit 1
        fi
        if [ -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]; then
          echo "::error::Set the repository variable VITE_CLERK_PUBLISHABLE_KEY for the frontend boot."
          exit 1
        fi
        mkdir -p tmp
        npm --prefix my-app run dev:frontend:raw -- --host 127.0.0.1 --port 5173 --strictPort --clearScreen false > tmp/playwright-vite.log 2>&1 &
        for attempt in $(seq 1 90); do
          if curl --fail --show-error --silent --head http://127.0.0.1:5173 >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "::error::Vite did not become ready on http://127.0.0.1:5173"
        tail -n 200 tmp/playwright-vite.log
        exit 1
      env:
        VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        NEXT_PUBLIC_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    - name: Run Playwright tests
      run: |
        set -euo pipefail
        SMOKE_SUITE="e2e/playwright-pr-smoke.spec.ts"
        FULL_SUITE="e2e/cvforge-preview-linking.spec.ts e2e/ds-v2.spec.ts e2e/proposal-command-layer.spec.ts e2e/proposal-mobile-layout.spec.ts e2e/proposal-workspace-roundtrip.spec.ts e2e/topbar-document-geometry.spec.ts"

        if [ "$PLAYWRIGHT_EVENT_NAME" = "workflow_dispatch" ] && [ "${PLAYWRIGHT_SUITE_INPUT:-}" = "smoke" ]; then
          SUITE="$SMOKE_SUITE"
          GLOBAL_TIMEOUT=300000
        elif [ "$PLAYWRIGHT_EVENT_NAME" = "workflow_dispatch" ] || [ "$PLAYWRIGHT_EVENT_NAME" = "schedule" ]; then
          SUITE="$FULL_SUITE"
          GLOBAL_TIMEOUT=840000
        else
          SUITE="$SMOKE_SUITE"
          GLOBAL_TIMEOUT=300000
        fi

        echo "Running Playwright suite: $SUITE"
        timeout --kill-after=60s 15m npx playwright test --project=chromium $SUITE --global-timeout="$GLOBAL_TIMEOUT"
      env:
        PLAYWRIGHT_EVENT_NAME: ${{ github.event_name }}
        PLAYWRIGHT_SUITE_INPUT: ${{ inputs.suite }}
        PLAYWRIGHT_APP_URL: http://127.0.0.1:5173
        VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        NEXT_PUBLIC_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: playwright-vite-log
        path: tmp/playwright-vite.log
        if-no-files-found: ignore
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: playwright-test-results
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
